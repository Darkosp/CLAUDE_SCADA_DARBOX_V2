# The cloud topology's broker (ADR-0017). Read by deploy/cloud/docker-compose.yml, and by the tests
# in tests/Gateway.Tests/BrokerConfigurationTests.cs, which run this file against a real Mosquitto.

# Two listeners, both TLS with a client certificate from our CA required of every client. The name
# in the certificate becomes the username the ACL below is written against — each edge is its own
# identity, never a shared password.
#
# 8883 is the edges' listener, the only one published. On it the client id is replaced by the
# certificate's name. Without that, an edge could connect under the Gateway's client id, take over
# its persistent session, and the broker would discard everything queued for the Gateway, because
# the edge may not read it (measured: "Drop message clientid …", and the Gateway came back to
# nothing). One compromised edge must not be able to do that to every other.
listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/broker.crt
keyfile /mosquitto/certs/broker.key
require_certificate true
use_identity_as_username true
use_username_as_clientid true

# 8884 is the Gateway's, inside the Compose network only. Its MQTT client per device keeps its own
# fixed client id, which is what its persistent session is keyed to (ADR-0017).
listener 8884
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/broker.crt
keyfile /mosquitto/certs/broker.key
require_certificate true
use_identity_as_username true

allow_anonymous false
# Copied here by broker.sh, owned by mosquitto and not world-readable, as Mosquitto requires.
acl_file /mosquitto/run/acl

# What the broker holds must survive the broker. The default persistence writes to disk only every
# 30 minutes and at a clean stop, so a crash loses everything queued since — and the edge has already
# deleted it, on the broker's acknowledgement. The SQLite store writes every change as it happens
# (flush period 0) and syncs it (measured: a queued message survives kill -9 this way, and not the
# default way, nor with the store's own default flush period).
global_plugin /usr/lib/mosquitto_persist_sqlite.so
plugin_opt_db_file /mosquitto/data/mosquitto.sqlite3
plugin_opt_flush_period 0
plugin_opt_sync full

# While the Gateway is away its persistent session queues everything published for it. The
# default caps that queue at 1000 messages and discards the rest without a word — the same silent
# hole the edge's buffer exists to prevent, one level down. No cap by count or by size: the limit is
# the disk, and the deployment guide says how to size it.
max_queued_messages 0
max_queued_bytes 0

# Everything is logged, because a refused publish is logged at no other level; the entrypoint
# (broker.sh) keeps per-packet chatter out of the container log and copies refusals and
# connections to the audit file.
log_dest stdout
log_type all
log_timestamp_format %Y-%m-%dT%H:%M:%S
