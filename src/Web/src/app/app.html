<main>
  <header>
    <h1>SCADA_DARBOX</h1>
    <span class="state" [class]="state()">{{ state() }}</span>
  </header>

  @if (tags().length === 0) {
    <p class="empty">Waiting for the first scan…</p>
  } @else {
    <ul class="tags">
      @for (tag of tags(); track tag.tagId) {
        <li [class.bad]="tag.quality !== 'Good'">
          <span class="path">{{ tag.path }}</span>
          <span class="reading">
            <span class="value">{{ value(tag) }}</span>
            @if (tag.unitSymbol) {
              <span class="unit">{{ tag.unitSymbol }}</span>
            }
          </span>
          <span class="meta">{{ tag.quality }} · {{ observedAt(tag) }}</span>
        </li>
      }
    </ul>
  }
</main>
